<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JR Intimates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FAF6F2;
    --rose-gold: #D4A373;
    --rose-gold-soft: #E9CBB4;
    --text-dark: #3E332C;
    --text-muted: #8A7A6D;
    --white: #FFFFFF;
    --border-soft: #EDD9C9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(212,163,115,0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(212,163,115,0.08), transparent 45%);
    font-family: 'Poppins', sans-serif;
    color: var(--text-dark);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 56px 20px 40px;
  }

  .card{
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* Header */
  .logo{
    width: 92px;
    height: 92px;
    border-radius: 50%;
    border: 1.5px solid var(--rose-gold);
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }

  .logo-inner{
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 22px;
    color: var(--rose-gold);
    letter-spacing: 1px;
  }

  .brand-name{
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: 28px;
    letter-spacing: 1px;
    color: var(--text-dark);
    margin-bottom: 10px;
  }

  .divider{
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--rose-gold);
    margin-bottom: 16px;
  }

  .divider::before,
  .divider::after{
    content: "";
    width: 34px;
    height: 1px;
    background: var(--border-soft);
  }

  .divider svg{ width: 14px; height: 14px; }

  .subtopics{
    font-size: 13px;
    color: var(--text-muted);
    letter-spacing: 0.3px;
    line-height: 1.8;
    margin-bottom: 34px;
  }

  .subtopics .line-2{
    font-size: 12px;
  }

  /* Buttons */
  .links{
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 46px;
  }

  .link-btn{
    display: flex;
    align-items: center;
    width: 100%;
    background: var(--white);
    border: 1px solid var(--border-soft);
    border-radius: 999px;
    padding: 12px 18px;
    text-decoration: none;
    color: var(--text-dark);
    font-size: 14.5px;
    font-weight: 500;
    letter-spacing: 0.2px;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    box-shadow: 0 1px 2px rgba(212,163,115,0.05);
  }

  .link-btn:hover{
    transform: translateY(-2px);
    border-color: var(--rose-gold);
    box-shadow: 0 8px 18px rgba(212,163,115,0.16);
  }

  .link-btn:focus-visible{
    outline: 2px solid var(--rose-gold);
    outline-offset: 3px;
  }

  .icon-circle{
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #FBF1E9;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-right: 12px;
  }

  .icon-circle svg{
    width: 16px;
    height: 16px;
    stroke: var(--rose-gold);
    fill: none;
  }

  .link-text{
    flex: 1 1 auto;
    text-align: center;
  }

  .arrow{
    flex: 0 0 auto;
    width: 16px;
    height: 16px;
    opacity: 0.45;
  }

  .arrow svg{ width: 100%; height: 100%; stroke: var(--text-muted); }

  /* Footer */
  .footer{
    text-align: center;
  }

  .footer-cursive{
    font-family: 'Great Vibes', cursive;
    font-size: 26px;
    color: var(--rose-gold);
    margin-bottom: 6px;
  }

  .footer-caption{
    font-size: 10.5px;
    letter-spacing: 1.6px;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  @media (prefers-reduced-motion: reduce){
    .link-btn{ transition: none; }
  }

  @media (max-width: 380px){
    .brand-name{ font-size: 25px; }
    .link-btn{ padding: 11px 14px; font-size: 13.5px; }
  }
</style>
</head>
<body>
